spring.application.name=Ameribank

server.port=8081

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.web-application-type=servlet
spring.thymeleaf.enabled=false
spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Tomcat hardening para sobrevivir floods/slowloris en el backup ---
# Threads y queue de accept
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=400
server.tomcat.accept-count=100

# Timeouts agresivos: corta conexiones lentas / slowloris
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=10000
server.tomcat.max-keep-alive-requests=100

# Limites de tamano de request (evita POST gigantes)
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
