# =====================================================================
# Ameribank - Reverse proxy con failover (LXC 1 → LXC 2 via Snort)
# Colocar en: /etc/nginx/conf.d/ameribank.conf
#
# Diferencias vs. la versión inicial del INFRAESTRUCTURA.md:
#  - IP del backup corregida a 40.0.4.11 (Snort filtra inline en L2)
#  - Timeouts ajustados: failover en ~4s en vez de ~10s
#  - proxy_next_upstream amplía a 504 y http_429
#  - keepalive al upstream para no abrir socket por request
#  - rate limit más permisivo + zona aparte para estáticos
#  - logs con fallback a /var/log/nginx si NFS no está montado
# =====================================================================

# Zonas de rate limiting (deben ir en el contexto http, no en server)
# OJO PARA LA DEMO: rate alto a propósito. Si rate=30r/s, Nginx absorbe
# el HTTP flood y el principal nunca cae. Para que la demo funcione el
# ataque debe llegar al backend → Snort es el que filtra al backup.
# En producción real bajar a 30r/s y dejar a Nginx como primera línea.
limit_req_zone  $binary_remote_addr zone=antiddos:10m  rate=500r/s;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# Log format extendido con tiempos de upstream y estado de failover
log_format ameribank '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'upstream=$upstream_addr '
                     'rt=$request_time urt=$upstream_response_time '
                     'tries=$upstream_status';

upstream ameribank {
    # Principal — sin IPS, debe caer en el DDoS
    server 40.0.4.10:8081 max_fails=2 fail_timeout=5s;

    # Backup — protegido por Snort inline en 40.0.4.13
    # Nginx apunta a la IP del LXC 2 directamente; Snort filtra en el camino
    server 40.0.4.11:8081 backup max_fails=2 fail_timeout=5s;

    # Mantener conexiones abiertas al backend Java
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name ameribank.local _;

    # Logs centralizados via NFS (con fallback si /mnt no está montado:
    # configurar /etc/fstab con _netdev,nofail y crear el dir local)
    access_log /mnt/splunk-logs/nginx-access.log ameribank;
    error_log  /mnt/splunk-logs/nginx-error.log warn;

    # Límites globales — laxos para la demo (ver comentario arriba)
    # En prod: limit_conn 20, limit_req burst=50
    limit_conn         connlimit 500;
    limit_req          zone=antiddos burst=1000 nodelay;
    client_body_timeout   5s;
    client_header_timeout 5s;
    keepalive_timeout    10s;
    send_timeout         10s;

    # Bloquear que usuarios externos vean el health check
    location /actuator {
        return 404;
    }

    # Estáticos sin rate limit estricto (los browsers piden muchos a la vez)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        limit_req zone=antiddos burst=200 nodelay;
        proxy_pass http://ameribank;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass 0;
        expires 1h;
    }

    location / {
        proxy_pass http://ameribank;

        # Failover: pasa al backup si el principal devuelve estos errores
        # OJO: GET/HEAD se reintentan automáticamente; para POST/PUT/DELETE
        # hay que añadir `non_idempotent` (riesgo: doble cobro / transferencia
        # duplicada). Lo dejamos fuera para que el cliente reintente
        # explícitamente desde el frontend.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Timeouts agresivos para detectar caídas rápido (~4s para failover)
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # Keepalive al upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint propio para monitoreo externo (script que apunta a Snort
    # o a un job que verifique salud del cluster sin pasar por la auth)
    location = /nginx-status {
        stub_status;
        access_log off;
        allow 40.0.4.0/24;
        deny all;
    }
}
